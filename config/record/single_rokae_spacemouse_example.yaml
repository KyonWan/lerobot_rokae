# 单臂 Rokae + SpaceMouse 录制示例（draccus / --config_path）
# 用法（在仓库根目录）:
#   ./scripts/record/rokae_record.sh --config_path=config/record/single_rokae_spacemouse_example.yaml
# 带时间戳的输出目录可仅在命令行覆盖 dataset.root，例如:
#   ... --dataset.root="/home/wanhao/Documents/datasets/test_$(date +%Y%m%d_%H%M%S)"
#
# joint_num / robot_ip 由 ZMQ server 的 get_robot_info 提供，无需在此配置。
# 请按现场修改: dataset.root、zmq_port、相机 serial 等。

resume: false
display_data: false
log_slow_loop_periodically: true

robot:
  type: rokae_robot
  control_mode: joint_position
  zmq_port: 5555
  cameras:
    left_wrist:
      type: intelrealsense
      serial_number_or_name: "260322273757"
      width: 640
      height: 480
      fps: 60
      use_depth: false

teleop:
  type: spacemouse
  device_index: 0

dataset:
  repo_id: test_2025/rokae_record
  single_task: "Grab the cube"
  root: ./dataset/single_rokae_example
  fps: 30
  num_episodes: 10
  episode_time_s: 100
  push_to_hub: false
  video: true
  vcodec: h264
