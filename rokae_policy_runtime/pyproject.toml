[project]
name = "rokae_policy_runtime"
version = "0.1.0"
description = "Policy runtime bridges for Rokae robot (OpenPI and future adapters)"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "lerobot",
    "lerobot_robot_rokae",
    "numpy",
    "opencv-python-headless>=4.9.0,<4.13.0",
    "scipy",
    "openpi-client",
]

[project.scripts]
rokae-openpi = "rokae_policy_runtime.openpi.cli:main"
rokae-openpi-bi = "rokae_policy_runtime.openpi.bi_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rokae_policy_runtime*"]
