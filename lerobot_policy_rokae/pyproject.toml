[project]
name = "lerobot_policy_rokae"
version = "0.1.0"
description = "LeRobot policy plugin for Rokae processor hub and custom policy scaffolding"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "lerobot",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_policy_rokae*"]
