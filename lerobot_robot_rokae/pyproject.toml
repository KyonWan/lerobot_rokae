[project]
name = "lerobot_robot_rokae"
version = "0.1.0"
description = "LeRobot plugin for Rokae robots"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "lerobot",
    "rokae_python_wrapper",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_rokae*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
