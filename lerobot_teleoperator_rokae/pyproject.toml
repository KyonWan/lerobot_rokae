[project]
name = "lerobot_teleoperator_rokae"
version = "0.1.0"
description = "LeRobot plugin for Rokae robots"
requires-python = ">=3.10"

dependencies = [
    "lerobot",
    "pyspacemouse",
    # 与 `pink_ik_helpers` / SpaceMouse 笛卡尔模式共用 `rokae_python_wrapper.rokae_ik_interface`（Pink + QP）
    "pin-pink",
    "qpsolvers[open_source_solvers]",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
